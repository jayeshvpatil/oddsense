[package]
name = "vibe-dash"
version = "0.1.0"
edition = "2021"
description = "Agent-native CLI for prediction market intelligence — sentiment analysis, divergence detection, and cross-platform arbitrage"
license = "MIT"
repository = "https://github.com/jayeshvpatil/vibe-dash"
homepage = "https://github.com/jayeshvpatil/vibe-dash"
readme = "README.md"
keywords = ["prediction-markets", "polymarket", "kalshi", "sentiment", "cli"]
categories = ["command-line-utilities", "finance"]
authors = ["Jayesh Patil"]

[[bin]]
name = "vibe-dash"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tabled = "0.17"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
directories = "6"
async-trait = "0.1"
strsim = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
